// # 📄 Dosya Yolu: C:/Projects/TelefonRehberi/mobile/android/app/build.gradle
// # 📌 Amac: Android uygulama modulunun SDK, Java ve paketleme ayarlarini tanimlar.
// # 📌 Config - Gradle
// # Version: 1.1.1
// # Aciklama: Android 16 API 36 ve Java 17 hedefli native Java mobil istemci build ayarlaridir.
// # Bagimli Oldugu Katman: Config
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.turkuazlabs.telefonrehberi.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.turkuazlabs.telefonrehberi.mobile'
        minSdk 26
        targetSdk 36
        versionCode 570
        versionName '2.37.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

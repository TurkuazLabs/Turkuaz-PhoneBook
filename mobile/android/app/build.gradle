// # 📄 Dosya Yolu: C:/Projects/TelefonRehberi/mobile/android/app/build.gradle
// # 📌 Amac: Android uygulama modulunun SDK, Java ve paketleme ayarlarini tanimlar.
// # 📌 Config - Gradle
// # Version: 1.3.0
// # Aciklama: Android 16 API 36, Java 17 ve Turkuaz PhoneBook 2.38.2 mobil istemci build ayarlaridir.
// # Bagimli Oldugu Katman: Config
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.turkuazlabs.telefonrehberi.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.turkuazlabs.telefonrehberi.mobile'
        minSdk 26
        targetSdk 36
        versionCode 582
        versionName '2.38.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

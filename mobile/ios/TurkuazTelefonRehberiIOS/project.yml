# 📄 Dosya Yolu: C:/Projects/TelefonRehberi/mobile/ios/TurkuazTelefonRehberiIOS/project.yml
# 📌 Amac: XcodeGen ile iOS Xcode projesini yeniden uretmek icin proje tanimini tutar.
# 📌 Config - YAML
# Version: 1.3.0
# Aciklama: iOS 18+, Swift 6, Turkuaz PhoneBook 2.38.1 build numarasi ve yerellestirilmis InfoPlist resource'larini tanimlar.
# Bagimli Oldugu Katman: Config | Language
name: TurkuazTelefonRehberiIOS
options:
  bundleIdPrefix: com.turkuazlabs
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.38.0"
    CURRENT_PROJECT_VERSION: "581"
targets:
  TurkuazTelefonRehberiIOS:
    type: application
    platform: iOS
    sources:
      - path: TurkuazTelefonRehberiIOSApp.swift
      - path: config
      - path: controllers
      - path: language
      - path: models
      - path: repositories
      - path: services
      - path: tools
      - path: views
    resources:
      - path: resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.turkuazlabs.telefonrehberi.ios
        TARGETED_DEVICE_FAMILY: "1,2"

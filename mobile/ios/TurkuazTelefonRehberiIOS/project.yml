name: TurkuazTelefonRehberiIOS
options:
  bundleIdPrefix: com.turkuazlabs
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.37.0"
    CURRENT_PROJECT_VERSION: "570"
targets:
  TurkuazTelefonRehberiIOS:
    type: application
    platform: iOS
    sources:
      - path: TurkuazTelefonRehberiIOSApp.swift
      - path: config
      - path: controllers
      - path: language
      - path: models
      - path: repositories
      - path: services
      - path: tools
      - path: views
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.turkuazlabs.telefonrehberi.ios
        TARGETED_DEVICE_FAMILY: "1,2"

# 📄 Dosya Yolu: C:/Projects/TelefonRehberi/.github/workflows/release.yml
# 📌 Amac: Version tag push edildiginde Windows, Linux ve Android release assetlerini GitHub Release olarak yayinlar.
# 📌 Tool - YAML
# Version: 2.8.0
# Aciklama: Cross-platform release uretir, SHA-dogrulamali Windows cache kullanir ve yayinlanan update manifestini guvenli sekilde main branch'e senkronize eder.
# Bagimli Oldugu Katman: Tool | Config | Language

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release-assets:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: launcher/native/go.mod

      - name: Restore Windows installer dependency cache
        uses: actions/cache@v6
        with:
          path: cache/installer
          key: windows-installer-v1-${{ hashFiles('config/launcher.yml') }}
          restore-keys: |
            windows-installer-v1-

      - name: Verify release version consistency
        shell: powershell
        run: .\tools\check-version-consistency.ps1

      - name: Run Java quality gate
        shell: powershell
        run: .\tools\test-java.ps1

      - name: Build Windows release assets
        shell: powershell
        run: .\tools\build-release.ps1 -ExpectedTag "${{ github.ref_name }}"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: .\tools\build-installer.ps1 -ExpectedTag "${{ github.ref_name }}"

      - name: Smoke test Windows installer
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $setup = Join-Path $PWD "dist\TelefonRehberi-Setup-v$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Setup bulunamadi: $setup" }
          $target = Join-Path $env:TEMP "TurkuazTelefonRehberi-Smoke"
          Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          $installArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"")
          $installProcess = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Setup smoke install basarisiz: $($installProcess.ExitCode)" }
          foreach ($required in @('TelefonRehberi.exe','app\TelefonRehberi.jar','config\installed.mode','runtime\temurin-17\bin\javaw.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $required))) { throw "Setup smoke eksik dosya: $required" }
          }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
            if ($uninstallProcess.ExitCode -ne 0) { throw "Setup smoke uninstall basarisiz: $($uninstallProcess.ExitCode)" }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: dist/
          if-no-files-found: error

  linux-release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: launcher/native/go.mod

      - name: Build Linux release assets
        shell: bash
        run: bash ./tools/build-linux-release.sh "${GITHUB_REF_NAME}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets
          path: dist-linux/
          if-no-files-found: error

  android-release-asset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Android endpoint quality gate
        shell: bash
        run: bash ./tools/test-android-endpoint.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename Android APK
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            "Turkuaz-PhoneBook-Android-${GITHUB_REF_NAME}-debug.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-asset
          path: Turkuaz-PhoneBook-Android-*-debug.apk
          if-no-files-found: error

  ios-source-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run iOS endpoint quality gate
        shell: bash
        run: bash ./tools/test-ios-endpoint.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mobile/ios/TurkuazTelefonRehberiIOS
        run: xcodegen generate

      - name: Build iOS simulator
        working-directory: mobile/ios/TurkuazTelefonRehberiIOS
        run: |
          xcodebuild \
            -project TurkuazTelefonRehberiIOS.xcodeproj \
            -scheme TurkuazTelefonRehberiIOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  publish-release:
    needs:
      - windows-release-assets
      - linux-release-assets
      - android-release-asset
      - ios-source-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release-assets
          path: release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-release-assets
          path: release-assets/linux

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: android-release-asset
          path: release-assets/android

      - name: Prepare cross-platform update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/publish
          cp release-assets/windows/TelefonRehberi.jar release-assets/publish/TelefonRehberi.jar
          cp release-assets/windows/TelefonRehberi.exe release-assets/publish/TelefonRehberi.exe
          cp release-assets/linux/TelefonRehberi-linux-amd64 release-assets/publish/TelefonRehberi-linux-amd64
          cp release-assets/windows/TelefonRehberi-Portable-v*-FULL.zip release-assets/publish/
          cp release-assets/windows/TelefonRehberi-Setup-v*.exe release-assets/publish/
          cp release-assets/linux/TelefonRehberi-Linux-v*-FULL.tar.gz release-assets/publish/
          cp release-assets/android/Turkuaz-PhoneBook-Android-*-debug.apk release-assets/publish/

          APP_VERSION="${GITHUB_REF_NAME#v}"
          LAUNCHER_VERSION="$(awk -F ':' '/^[[:space:]]*launcher_version[[:space:]]*:/ {gsub(/[ \"\047]/, "", $2); print $2; exit}' config/version.yml)"
          APP_SHA="$(sha256sum release-assets/publish/TelefonRehberi.jar | awk '{print $1}')"
          WINDOWS_SHA="$(sha256sum release-assets/publish/TelefonRehberi.exe | awk '{print $1}')"
          LINUX_SHA="$(sha256sum release-assets/publish/TelefonRehberi-linux-amd64 | awk '{print $1}')"
          WINDOWS_SETUP="$(basename "$(find release-assets/publish -maxdepth 1 -name 'TelefonRehberi-Setup-v*.exe' -print -quit)")"
          WINDOWS_SETUP_SHA="$(sha256sum "release-assets/publish/${WINDOWS_SETUP}" | awk '{print $1}')"

          cat > release-assets/publish/update-manifest.yml <<MANIFEST
          # 📄 Dosya Yolu: C:/Projects/TelefonRehberi/updates/update-manifest.yml
          # 📌 Amac: Son yayinlanmis GitHub Release update metadata ve SHA-256 degerlerini referans olarak tutar.
          # 📌 Modul - YAML
          # Version: 2.8.0
          # Aciklama: v${APP_VERSION} icin yayinlanmis cross-platform JAR, native launcher ve Windows Setup update referansidir.
          # Bagimli Oldugu Katman: Tool

          app_version: "${APP_VERSION}"
          app_asset: "TelefonRehberi.jar"
          app_sha256: "${APP_SHA}"
          launcher_version: "${LAUNCHER_VERSION}"
          launcher_windows_asset: "TelefonRehberi.exe"
          launcher_windows_sha256: "${WINDOWS_SHA}"
          launcher_linux_asset: "TelefonRehberi-linux-amd64"
          launcher_linux_sha256: "${LINUX_SHA}"
          windows_setup_asset: "${WINDOWS_SETUP}"
          windows_setup_sha256: "${WINDOWS_SETUP_SHA}"
          launcher_asset: "TelefonRehberi.exe"
          launcher_sha256: "${WINDOWS_SHA}"
          MANIFEST

          (
            cd release-assets/publish
            sha256sum TelefonRehberi.jar TelefonRehberi.exe TelefonRehberi-linux-amd64 \
              TelefonRehberi-Portable-v*-FULL.zip TelefonRehberi-Setup-v*.exe TelefonRehberi-Linux-v*-FULL.tar.gz \
              Turkuaz-PhoneBook-Android-*-debug.apk update-manifest.yml > CHECKSUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WINDOWS_ZIP="release-assets/publish/TelefonRehberi-Portable-${GITHUB_REF_NAME}-FULL.zip"
          LINUX_TAR="release-assets/publish/TelefonRehberi-Linux-${GITHUB_REF_NAME}-FULL.tar.gz"
          WINDOWS_SETUP="release-assets/publish/TelefonRehberi-Setup-${GITHUB_REF_NAME}.exe"
          ANDROID_APK="release-assets/publish/Turkuaz-PhoneBook-Android-${GITHUB_REF_NAME}-debug.apk"
          gh release create "${GITHUB_REF_NAME}" \
            "release-assets/publish/TelefonRehberi.jar#Application-JAR" \
            "release-assets/publish/TelefonRehberi.exe#Windows-Native-Launcher" \
            "release-assets/publish/TelefonRehberi-linux-amd64#Linux-Native-Launcher" \
            "release-assets/publish/update-manifest.yml#Update-Manifest" \
            "release-assets/publish/CHECKSUMS.txt#SHA-256-Checksums" \
            "${WINDOWS_ZIP}#Windows-Portable-Full" \
            "${WINDOWS_SETUP}#Windows-Inno-Setup" \
            "${LINUX_TAR}#Linux-Portable-Full" \
            "${ANDROID_APK}#Android-Test-APK" \
            --verify-tag \
            --generate-notes \
            --title "Turkuaz PhoneBook ${GITHUB_REF_NAME}"

      - name: Sync published update manifest to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bash ./tools/sync-published-manifest.sh \
            "${GITHUB_REF_NAME}" \
            "release-assets/publish/update-manifest.yml" \
            "updates/update-manifest.yml" \
            "main"

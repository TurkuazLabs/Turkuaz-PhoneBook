# 📄 Dosya Yolu: C:/Projects/TelefonRehberi/.github/workflows/build.yml
# 📌 Amac: Masaustu, Android ve iOS kaynaklarini main/pull request degisikliklerinde dogrular.
# 📌 Tool - YAML
# Version: 2.11.0
# Aciklama: Windows/Linux Java quality gate, version consistency, native launcher, Inno Setup smoke, Android/iOS kontrolleri, main artefactlari ve v2.38.2 green-build release kapisini yonetir.
# Bagimli Oldugu Katman: Tool | Config

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop-java-17:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: launcher/native/go.mod

      - name: Verify release version consistency
        shell: powershell
        run: .\tools\check-version-consistency.ps1

      - name: Run Java quality gate
        shell: powershell
        run: .\tools\test-java.ps1

      - name: Build desktop
        shell: powershell
        run: .\tools\build-release.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: .\tools\build-installer.ps1

      - name: Smoke test Windows installer
        shell: powershell
        run: |
          $versionMatch = Select-String -Path .\config\version.yml -Pattern '^app_version:' | Select-Object -First 1
          if ($null -eq $versionMatch) { throw "app_version bulunamadi" }
          $version = ($versionMatch.Line -split ':',2)[1].Trim().Trim('"')
          if ([string]::IsNullOrWhiteSpace($version)) { throw "app_version bos" }
          $setup = Join-Path $PWD "dist\TelefonRehberi-Setup-v$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Setup bulunamadi: $setup" }
          $target = Join-Path $env:TEMP "TurkuazTelefonRehberi-Smoke"
          Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          $installArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"")
          $installProcess = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Setup smoke install basarisiz: $($installProcess.ExitCode)" }
          foreach ($required in @('TelefonRehberi.exe','app\TelefonRehberi.jar','config\installed.mode','runtime\temurin-17\bin\javaw.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $required))) { throw "Setup smoke eksik dosya: $required" }
          }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
            if ($uninstallProcess.ExitCode -ne 0) { throw "Setup smoke uninstall basarisiz: $($uninstallProcess.ExitCode)" }
          }

      - name: Upload Windows main-build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-main-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: launcher/native/go.mod

      - name: Run Linux Java quality gate
        shell: bash
        run: bash ./tools/test-java.sh

      - name: Build Linux native release
        shell: bash
        run: bash ./tools/build-linux-release.sh

      - name: Upload Linux main-build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: linux-main-build
          path: dist-linux/
          if-no-files-found: error
          retention-days: 7

  android-api-36:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Android endpoint quality gate
        shell: bash
        run: bash ./tools/test-android-endpoint.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android main-build APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: android-main-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run iOS endpoint quality gate
        shell: bash
        run: bash ./tools/test-ios-endpoint.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mobile/ios/TurkuazTelefonRehberiIOS
        run: xcodegen generate

      - name: Build iOS simulator
        working-directory: mobile/ios/TurkuazTelefonRehberiIOS
        run: |
          xcodebuild \
            -project TurkuazTelefonRehberiIOS.xcodeproj \
            -scheme TurkuazTelefonRehberiIOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build


  release-v2-38-2:
    if: github.event_name == 'push' && github.event.head_commit.message == 'publish v2.38.2 release'
    needs:
      - desktop-java-17
      - linux-native
      - android-api-36
      - ios-simulator
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify v2.38.2 release target
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk -F ':' '/^[[:space:]]*app_version[[:space:]]*:/ {gsub(/[ \"\047]/, "", $2); print $2; exit}' config/version.yml)"
          if [ "$APP_VERSION" != "2.38.2" ]; then
            echo "app_version v2.38.2 degil: $APP_VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v2.38.2 >/dev/null 2>&1; then
            echo "v2.38.2 tag zaten mevcut." >&2
            exit 1
          fi

      - name: Create annotated v2.38.2 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TurkuazLabs Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git tag -a v2.38.2 "$GITHUB_SHA" -m "Turkuaz PhoneBook v2.38.2"
          git push origin refs/tags/v2.38.2

      - name: Dispatch v2.38.2 release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref='v2.38.2'

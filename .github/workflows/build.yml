# 📄 Dosya Yolu: C:/Projects/TelefonRehberi/.github/workflows/build.yml
# 📌 Amac: Masaustu, Android ve iOS kaynaklarini main/pull request degisikliklerinde dogrular.
# 📌 Tool - YAML
# Version: 2.5.1
# Aciklama: Java SQLite quality gate, native launcher, Inno Setup smoke, Linux, Android API 36 ve iOS build kontrollerini calistirir.
# Bagimli Oldugu Katman: Tool | Config

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop-java-17:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Run Java quality gate
        shell: powershell
        run: .\tools\test-java.ps1

      - name: Build desktop
        shell: powershell
        run: .\tools\build-release.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: .\tools\build-installer.ps1

      - name: Smoke test Windows installer
        shell: powershell
        run: |
          $version = (Select-String -Path .\config\version.yml -Pattern '^app_version:' | ForEach-Object { ($_ -split ':',2)[1].Trim().Trim('"') })
          $setup = Join-Path $PWD "dist\TelefonRehberi-Setup-v$version.exe"
          $target = Join-Path $env:TEMP "TurkuazTelefonRehberi-Smoke"
          Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$target"
          if ($LASTEXITCODE -ne 0) { throw "Setup smoke install basarisiz: $LASTEXITCODE" }
          foreach ($required in @('TelefonRehberi.exe','app\TelefonRehberi.jar','config\installed.mode','runtime\bin\javaw.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $required))) { throw "Setup smoke eksik dosya: $required" }
          }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (Test-Path -LiteralPath $uninstaller) { & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART }

  linux-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Build Linux native release
        run: ./tools/build-linux-release.sh

  android-api-36:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

  ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mobile/ios/TurkuazTelefonRehberiIOS
        run: xcodegen generate

      - name: Build iOS simulator
        working-directory: mobile/ios/TurkuazTelefonRehberiIOS
        run: |
          xcodebuild \
            -project TurkuazTelefonRehberiIOS.xcodeproj \
            -scheme TurkuazTelefonRehberiIOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
